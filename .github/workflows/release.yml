name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Publish as a draft release
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: app
          workspaces: src-tauri -> target

      - uses: Swatinem/rust-cache@v2
        with:
          key: native
          workspaces: native/jarvis-disk -> target

      # A tag must describe the version the installer will report.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Tag $env:GITHUB_REF_NAME does not match package.json version $($pkg.version)"
          }
          Write-Host "tag $env:GITHUB_REF_NAME matches package.json"

      - name: Install frontend dependencies
        run: npm ci

      # Icons are committed; regenerating keeps them byte-identical to the
      # generator if a release is built from a checkout with stale assets.
      - name: Regenerate icons
        run: python scripts/make_icon.py

      # The embedded interpreter and the pinned wheels are installed here, on a
      # clean runner: no developer paths end up in the shipped backend.
      - name: Build the Python backend
        run: powershell -ExecutionPolicy Bypass -File scripts/build_backend.ps1

      - name: Build the native disk scanner
        run: powershell -ExecutionPolicy Bypass -File scripts/build_disk_scan.ps1

      - name: Build the app and the NSIS installer
        run: npm run tauri:build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          if (-not (Test-Path $dir)) { throw "NSIS bundle missing: $dir" }
          Get-ChildItem $dir -Filter *.exe | ForEach-Object {
              Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB"
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem $dir | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
